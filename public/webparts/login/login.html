<div class="max-w-md mx-auto mt-16 p-4">
  <div class="card animate-fade-in">
    <h1>Login</h1>
    <p>Please enter your credentials to access the journey app.</p>
    
    <form class="space-y-4 mt-6">
      <div class="input-icon-wrapper">
        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
        </svg>
        <input type="email" placeholder="email@domain" class="form-input-with-icon" required>
      </div>
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-widest mb-2" style="color: var(--text-muted);">
          Password
        </label>
        <div class="input-icon-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input type="password" placeholder="••••••••" class="form-input-with-icon" required>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="btn-primary w-full">Sign In</button>
      </div>
    </form>

    <div class="mt-8 pt-6 border-t" style="border-color: var(--border-main);">
      <h3>Need Help?</h3>
      <p>Having trouble logging in?</p>
      <a href="/reset-password" class="text-sm">Reset your password →</a>
    </div>
  </div>
</div>
