<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCC Journey | Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white w-100 align-items-center">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="NSCCJourney" style="width: 150px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav ms-auto w-100 d-flex justify-content-end p-2">
                    <li class="nav-item mr-3">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item mr-3">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                    <li class="nav-item mr-3">
                        <a class="nav-link" href="#contact">Contact Us</a>
                    </li>
                    <li class="nav-item mr-3">
                      <a class="nav-link" href="rider-signup.html">Sign Up</a>
                    </li>
                 </ul>
            </div>
          </div>
      </nav>
    
    <section id="hero">    
        <div class="size text-center">
            <img src="images/logo.png" class="logo">  
    
            <form id="loginForm" novalidate>
                <div class="mb-3 w-80 mx-auto text-start">
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>
    
                <div class="mb-3 w-80 mx-auto text-start">
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required minlength="6">
                    <div class="invalid-feedback">Password must be at least 6 characters.</div>
                </div>
    
                <a href="forgot-password.html" class="d-block mb-3">Forgot Password?</a>
    
                <button type="submit" class="btn btn-custom-sec w-50">Login</button>
            </form>
        </div>    
    </section>
    
    <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        if (!this.checkValidity()) {
            event.preventDefault(); // Prevent form submission
            event.stopPropagation();
        }
        this.classList.add("was-validated"); // Add Bootstrap validation styles
    });
    </script>
    
    
    <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        if (!this.checkValidity()) {
            event.preventDefault(); // Prevent form submission

        }
        this.classList.add("was-validated"); // Add Bootstrap validation styles
    });
    </script>
    


<script src="../myjourney/scripts/script.js"></script>
