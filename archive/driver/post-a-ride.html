<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSCC Journey | Driver Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white w-100 align-items-center">
      <div class="container-fluid">
          <a class="navbar-brand" href="index.html">
              <img src="../images/logo.png" alt="NSCCJourney" style="width: 150px;">
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
              <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="collapsibleNavbar">
              <ul class="navbar-nav ms-auto w-100 d-flex justify-content-end p-2">
                  <li class="nav-item mr-3">
                      <a class="nav-link" href="driver-profile.html">My Profile</a>
                  </li>
                  <li class="nav-item mr-3">
                      <a class="nav-link" href="#">About Us</a>
                  </li>
                  <li class="nav-item mr-3">
                      <a class="nav-link" href="#contact">Contact Us</a>
                  </li>
                  <li class="nav-item mr-3">
                    <a class="nav-link" href="#">Logout</a>
                  </li>
               </ul>
          </div>
        </div>
    </nav>

    <section id="hero">    
      <div class="size text-center">
          <h1 class="mb-4">Post a Ride</h1> <!-- Added margin-bottom for space -->
          <!-- Divider Line -->
          <hr class="hr mb-4"> <!-- Added margin-bottom -->
    
          <!-- Ride Information -->
          <h6 class="text-start mb-3">Enter Ride Information</h6> <!-- Added margin-bottom -->
          <div class="more-info">
              <label for="from" class="mb-2">From:</label>
              <select id="from" class="form-select mb-3"> <!-- Added margin-bottom -->
                  <option value="">Select Location</option>
                  <option value="city1">City 1</option>
                  <option value="city2">City 2</option>
              </select>
    
              <label for="to" class="mt-2 mb-2">To:</label>
              <select id="to" class="form-select mb-3">
                  <option value="">Select Destination</option>
                  <option value="city3">City 3</option>
                  <option value="city4">City 4</option>
              </select>
    
              <label for="stop" class="mt-2 mb-2">Stop (Optional):</label>
              <select id="stop" class="form-select mb-3">
                  <option value="">Select Stop</option>
                  <option value="stop1">Stop 1</option>
                  <option value="stop2">Stop 2</option>
              </select>
    
              <label for="date" class="mt-2 mb-2">Select Date:</label>
              <input type="date" id="date" class="form-control mb-3">
    
              <div class="row mt-3">
                  <div class="col">
                      <label for="departure" class="mb-2">Departure Time:</label>
                      <input type="time" id="departure" class="form-control">
                  </div>
                  <div class="col">
                      <label for="arrival" class="mb-2">Arrival Time:</label>
                      <input type="time" id="arrival" class="form-control">
                  </div>
              </div>
          </div>
    
          <!-- Buttons -->
          <div class="d-grid gap-2 w-100 mx-auto mt-4"> <!-- Increased top margin -->
              <a href="driver-profile.html" class="btn btn-custom">Save</a>
          </div>
      </div>    
  </section>
  

    

     <!-- Footer Section -->
  <footer class="footer" id="contact">
    <div class="container-fluid row">
      <div class="col-lg-6 footer-item copyright d-flex flex-wrap justify-content-between">
        <div>
          <div class="container-fluid"><a> Copyright © 2025 NSCC JOURNEY. All rights reserved.</a></div>
          <div class="container-fluid" id="section2">
            <a href="#" class="privacy_policy">Privacy Policy</a> |
            <a href="#" class="use_of_cookies">Use of Cookies</a> |
            <a href="#" class="terms_of_use">Terms of Use</a>
          </div>
        </div>
      </div>
      
      <div class="col-lg-6 footer_socials_contact d-flex flex-wrap justify-content-between pt-2">
        <div class="col-lg-6 footer-item social-media">
            <a href="#" class="instagram"><img src="../images/instagram.png" alt="Instagram"></a>
            <a href="#" class="youtube"><img src="../images/youtube.png" alt="YouTube"></a>
            <a href="#" class="linkedin"><img src="../images/linkedin.png" alt="LinkedIn"></a>
        </div>
        <div class="col-lg-6 footer-item contact-info" id="email_phone">
          <h4>Contact Us</h4>
          <p>Email: <a href="mailto:contact-nsccride@nroute.com">contact@nsccjourney.com</a></p>
          <p>Phone: 902-502-5555</p>
        </div>
      </div>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
