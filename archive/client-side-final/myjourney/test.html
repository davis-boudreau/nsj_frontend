<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Collapsible Menu</title>
    <style>
        /* CSS goes here */
        /* Basic styles for the navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: right;
    background-color: #333;
    padding: 10px;
}

.menu {
    list-style: none;
    display: flex;
    gap: 15px;
}

.menu li a {
    color: white;
    text-decoration: none;
    padding: 10px;
}

.menu-icon {
    font-size: 24px;
    cursor: pointer;
    color: white;
}

/* Responsive styles */
@media (max-width: 768px) {
    .menu {
        display: none;
    }

    .menu.show {
        display: flex;
    }
}

    </style>
</head>
<body>
    <nav class="navbar">
        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="menu-icon" onclick="toggleMenu()">
            &#9776; <!-- Hamburger icon -->
        </div>
    </nav>

    <script>
        // JavaScript goes here
        function toggleMenu() {
    const menu = document.querySelector('.menu');
    menu.classList.toggle('show');
}


    </script>
</body>
</html>
