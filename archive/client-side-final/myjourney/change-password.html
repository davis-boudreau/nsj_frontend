<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NSCC Journey | Change Password</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light" role="navigation" aria-label="Main navigation">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
          <img src="images/logo.png" alt="NSCC Journey Logo" style="width: 150px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact Us</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Sign Up</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <section id="hero">    
    <div class="size text-center">
        <img src="images/logo.png" class="logo">  

        <h6>Change Your Password</h6>
        <p>Please enter your new password below.</p>

        <form id="changePasswordForm" novalidate>
            <div class="mb-3 w-80 mx-auto text-start">
                <input type="password" id="currentPassword" class="form-control" placeholder="Enter your current password" required minlength="6">
                <div class="invalid-feedback">Current password must be at least 6 characters.</div>
            </div>

            <div class="mb-3 w-80 mx-auto text-start">
                <input type="password" id="newPassword" class="form-control" placeholder="Enter your new password" required minlength="6">
                <div class="invalid-feedback">New password must be at least 6 characters.</div>
            </div>

            <div class="mb-3 w-80 mx-auto text-start">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your new password" required minlength="6">
                <div class="invalid-feedback">Please confirm your new password.</div>
            </div>

            <a href="successful-pw-change.html" type="submit" class="btn btn-custom-sec w-75">Change Password</a>
        </form>
    </div>    
  </section>


  <div id="footer"></div>
  <script src="../myjourney/scripts/script.js"></script>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById("changePasswordForm").addEventListener("submit", function(event) {
        if (!this.checkValidity()) {
            event.preventDefault(); // Prevent form submission
            event.stopPropagation();
        }
        this.classList.add("was-validated"); // Add Bootstrap validation styles
    });
    </script>
    
    
    
    <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        if (!this.checkValidity()) {
            event.preventDefault(); // Prevent form submission
            event.stopPropagation();
        }
        this.classList.add("was-validated"); // Add Bootstrap validation styles
    });
    </script>

</body>
</html>
